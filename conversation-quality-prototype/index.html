<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>AI会话质检 | 雪梨英语管理系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true"><span>雪</span></div>
          <span class="brand-name">雪梨英语管理系统</span>
        </div>
        <div class="breadcrumbs" aria-label="当前位置">
          <span>AI销售</span>
          <span class="crumb-separator">/</span>
          <strong>AI会话质检</strong>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" aria-label="通知" title="通知"><span class="icon icon-bell"></span></button>
          <button class="profile-button" title="个人中心"><span class="profile-dot">郑</span><span>郑舜杰</span><span class="chevron-down"></span></button>
        </div>
      </header>

      <aside class="sidebar" aria-label="主导航">
        <nav class="side-nav">
          <button class="side-nav-item" title="首页"><span class="icon icon-home"></span></button>
          <button class="side-nav-item" title="用户"><span class="icon icon-user"></span></button>
          <button class="side-nav-item active" title="AI会话质检"><span class="icon icon-robot"></span></button>
          <button class="side-nav-item" title="任务"><span class="icon icon-list"></span></button>
          <button class="side-nav-item" title="视频"><span class="icon icon-video"></span></button>
          <button class="side-nav-item" title="组织"><span class="icon icon-team"></span></button>
          <button class="side-nav-item" title="设置"><span class="icon icon-setting"></span></button>
        </nav>
        <button class="sidebar-collapse" aria-label="收起侧边栏"><span class="icon icon-menu"></span></button>
      </aside>

      <main class="main-content">
        <div class="page-heading">
          <div>
            <h1>AI会话质检</h1>
            <p><span class="status-dot"></span>数据来自销售企微会话</p>
          </div>
        </div>

        <section class="filter-bar" aria-label="时间筛选">
          <div class="quick-filters" role="tablist" aria-label="快捷时间">
            <button class="quick-filter active" data-range="today">今天</button>
            <button class="quick-filter" data-range="yesterday">昨天</button>
            <button class="quick-filter" data-range="week">近7天</button>
          </div>
          <label class="date-input"><span class="icon icon-calendar"></span><input id="start-date" type="date" value="2026-10-21" aria-label="开始日期" /></label>
          <span class="date-separator">至</span>
          <label class="date-input"><input id="end-date" type="date" value="2026-10-21" aria-label="结束日期" /></label>
          <button class="refresh-button" id="refresh-button"><span class="icon icon-refresh"></span><span>刷新</span></button>
          <div class="age-filter" id="age-filter">
            <span class="age-filter-label">添加时间：</span>
            <div class="age-filter-buttons" role="tablist" aria-label="客户添加时间">
              <button class="age-filter-button active" role="tab" aria-selected="true" aria-describedby="new-customer-tooltip" data-age="new">
                新客户
                <span class="age-button-tooltip" id="new-customer-tooltip" role="tooltip">添加时间在所选会话时间内为新客户</span>
              </button>
              <button class="age-filter-button" role="tab" aria-selected="false" aria-describedby="old-customer-tooltip" data-age="old">
                老客户
                <span class="age-button-tooltip" id="old-customer-tooltip" role="tooltip">添加时间在所选会话时间内为老客户</span>
              </button>
            </div>
          </div>
          <div class="tag-filter" id="tag-filter">
            <span class="tag-filter-label">客户标签：</span>
            <button class="tag-filter-trigger" id="tag-filter-trigger" aria-haspopup="dialog" aria-controls="tag-filter-overlay">
              <span class="tag-trigger-content" id="tag-trigger-content"><span class="tag-trigger-placeholder">请选择标签</span></span>
              <span class="chevron-down" aria-hidden="true"></span>
              <span class="tag-trigger-tooltip" id="tag-trigger-tooltip" role="tooltip" hidden></span>
            </button>
          </div>
          <span class="refresh-state" id="refresh-state" role="status">已是最新</span>
        </section>

        <section class="workspace" aria-label="会话质检工作区">
          <section class="panel account-panel">
            <div class="panel-header">
              <div>
                <h2>销售企微账号</h2>
                <p>共 80 个账号</p>
              </div>
              <div class="panel-tools"><button class="plain-icon" aria-label="收藏账号" title="收藏账号"><span class="icon icon-star"></span></button><button class="plain-icon" aria-label="收起账号栏" title="收起账号栏"><span class="icon icon-chevron-left"></span></button></div>
            </div>
            <label class="search-box"><span class="icon icon-search"></span><input id="account-search" placeholder="搜索账号名称或企微ID" /></label>
            <div class="list-scroll" id="account-list"></div>
          </section>

          <section class="panel customer-panel">
            <div class="panel-header">
              <div>
                <h2>外部联系人</h2>
                <p id="contact-count">客户数：67</p>
              </div>
              <div class="panel-tools"><button class="plain-icon" aria-label="收藏客户" title="收藏客户"><span class="icon icon-star"></span></button><button class="plain-icon" aria-label="收起客户栏" title="收起客户栏"><span class="icon icon-chevron-left"></span></button></div>
            </div>
            <div class="contact-kind-tabs" role="tablist" aria-label="外部联系人类型">
              <button class="contact-kind-tab active" role="tab" aria-selected="true" data-kind="customer">客户</button>
              <button class="contact-kind-tab" role="tab" aria-selected="false" data-kind="group">群聊</button>
            </div>
            <label class="search-box"><span class="icon icon-search"></span><input id="customer-search" placeholder="搜索客户名称或ID" /></label>
            <div class="contact-status-filters" id="contact-status-filters" role="tablist" aria-label="客户状态"></div>
            <div class="list-scroll customer-list" id="customer-list"></div>
          </section>

          <section class="panel conversation-panel" aria-label="只读会话展示" aria-readonly="true">
            <div class="conversation-header">
              <div class="conversation-identity"><div class="avatar avatar-large" id="conversation-avatar">墨</div><h2 id="conversation-title">墨言（邮政）</h2><span class="readonly-badge">只读</span></div>
              <button class="outline-button" id="favorite-button"><span class="icon icon-star"></span><span id="favorite-label">收藏</span></button>
            </div>
            <label class="search-box conversation-search"><span class="icon icon-search"></span><input id="message-search" placeholder="搜索当前时间范围内的聊天内容" /></label>
            <div class="conversation-meta"><span id="message-page-label">第 1 页 · 共 17 条</span><button class="ghost-button">筛选</button></div>
            <div class="messages" id="messages"></div>
          </section>

          <footer class="workspace-footer" aria-label="翻页">
            <div class="footer-pagination footer-pagination-left">
              <button class="footer-arrow" id="account-prev" disabled aria-label="上一页账号">‹</button>
              <span id="account-page">1 / 6</span>
              <button class="footer-arrow" id="account-next" aria-label="下一页账号">›</button>
            </div>
            <div class="footer-pagination footer-pagination-center">
              <button class="footer-arrow" id="customer-prev" disabled aria-label="上一页客户">‹</button>
              <span id="customer-page">1 / 1</span>
              <button class="footer-arrow" id="customer-next" disabled aria-label="下一页客户">›</button>
            </div>
            <div class="footer-pagination footer-pagination-right">
              <span id="message-count">共 17 条</span>
              <select aria-label="每页条数"><option>50条/页</option><option>20条/页</option><option>10条/页</option></select>
              <button class="footer-arrow" disabled aria-label="上一页会话">‹</button>
              <span class="page-current">1</span>
              <button class="footer-arrow" disabled aria-label="下一页会话">›</button>
              <label>前往 <input type="number" value="1" min="1" aria-label="跳转页码" /> 页</label>
            </div>
          </footer>
        </section>
      </main>

      <div class="tag-filter-overlay" id="tag-filter-overlay" hidden>
        <section class="tag-filter-dialog" role="dialog" aria-modal="true" aria-labelledby="tag-dialog-title">
          <header class="tag-dialog-header">
            <div><h2 id="tag-dialog-title">筛选客户标签</h2><p>选择一个或多个客户标签</p></div>
            <button class="tag-dialog-close" id="tag-dialog-close" aria-label="关闭标签筛选">×</button>
          </header>
          <div class="tag-selected-summary">
            <span class="tag-summary-label">已选标签</span>
            <div class="tag-selected-list" id="tag-selected-list"></div>
          </div>
          <div class="tag-dialog-body">
            <aside class="tag-group-pane">
              <h3>标签组 <small>共 90 个</small></h3>
              <label class="tag-search"><span class="icon icon-search"></span><input id="tag-group-search" placeholder="搜索标签组" /></label>
              <div class="tag-group-list" id="tag-group-list"></div>
            </aside>
            <section class="tag-option-pane">
              <div class="tag-option-heading"><h3 id="tag-option-title">标签</h3><button class="tag-select-all" id="tag-select-all">全选</button></div>
              <label class="tag-search"><span class="icon icon-search"></span><input id="tag-name-search" placeholder="搜索标签" /></label>
              <div class="tag-option-list" id="tag-option-list"></div>
            </section>
          </div>
          <footer class="tag-dialog-footer">
            <button class="tag-dialog-button secondary" id="tag-dialog-cancel">取消</button>
            <button class="tag-dialog-button primary" id="tag-dialog-confirm">确认</button>
          </footer>
        </section>
      </div>

      <div class="toast" id="toast" role="status"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
