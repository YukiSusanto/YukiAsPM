<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI销售助手 | 雪梨英语管理系统</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./dynamics.css"></head>
<body>
<header class="system-header"><a class="brand" href="#"><span class="brand-avatar">👩🏻‍🏫</span><strong>雪梨英语管理系统</strong></a><div class="breadcrumb">AI销售 <span>/</span> AI销售助手</div><div class="header-actions"><button title="通知" data-action="notice">♧</button><button data-action="department">私域部⌄</button></div></header>
<nav class="rail" aria-label="系统导航"></nav>
<main><header class="toolbar"><h1>AI 销售助手</h1><button class="account" data-action="account"><span class="teacher">👩🏻</span><span>606-李梦莹-助理-202605-至今</span>⌄</button><label class="global-search"><span>⌕</span><input id="global-search" placeholder="全局搜索客户、手机号"></label><button class="plain-button" data-action="ai-settings">AI 回复管理</button></header>
<div class="workspace">
<aside class="contacts"><div class="contacts-heading"><h2>客户会话</h2><button class="notice-button" title="企微应用通知" data-action="notice">⚑</button></div><div class="contact-tabs" role="tablist"><button class="active" role="tab">最近联系</button><button role="tab">全部客户</button><button role="tab">全部社群</button></div><div class="contact-search"><label><span>⌕</span><input id="contact-search" placeholder="搜索昵称"></label><button class="plain-button" data-action="filter">筛选</button></div><div id="filter-panel" hidden><label><input type="checkbox" id="unread-only"> 仅看未读客户</label><label><input type="checkbox" id="unreplied-only"> 仅看未回复</label></div><div class="contact-list" id="contact-list"></div><div class="vertical-resizer" id="contacts-resizer" role="separator" aria-label="调整客户会话宽度"></div></aside>
<section class="chat-pane"><header class="chat-heading"><strong id="chat-name">特立独行</strong><button class="ai-state" data-action="ai-toggle"><span class="switch"></span><b>AI 自动回复中</b></button><button class="reopen" data-action="open-sidebar" hidden>客户画像 ‹</button></header><div class="messages" id="messages"></div><div class="composer-resizer" role="separator" aria-label="调整消息发送区高度"></div><div class="composer"><div class="composer-tools"><button data-action="emoji">☺ 表情</button><button data-action="stickers">表情包</button><button data-action="image">▧ 图片</button><button data-action="file">▱ 文件</button><button data-action="history">☷ 聊天记录</button><small id="character-count">0/500</small></div><div class="emoji-picker" hidden><button>😊</button><button>🌹</button><button>❤️</button><button>👍</button><button>☺</button><button>🎉</button></div><textarea id="message-input" maxlength="500" placeholder="请输入会话内容，Enter 发送，Shift+Enter 换行"></textarea><div class="send-row"><button class="send-button" id="send-button" disabled>发送</button></div><input type="file" id="attachment" hidden></div></section>
<aside class="insight-pane"><div class="vertical-resizer" id="insight-resizer" role="separator" aria-label="调整客户画像宽度"></div><header class="insight-tabs"><button class="active" data-main-tab="profile">客户画像</button><button data-main-tab="history">会话记录</button><button class="collapse" data-action="close-sidebar" aria-label="收起右侧面板">×</button></header><div id="profile-content"><div class="profile-summary"><div id="profile-avatar" class="avatar large-avatar"></div><div class="person-main"><div class="person-name"><b id="profile-name">特立独行</b><span>0</span></div><div class="intent"><div class="intent-header"><span>意向度</span><b title="未评估">未</b></div><div class="intent-track"><i></i><i></i><i></i><i></i><i></i></div><div class="intent-labels"><span>弱</span><span>低</span><span>中</span><span>高</span><span>极高</span></div></div></div></div><div class="profile-tabs" role="tablist"><button role="tab" data-tab="info" class="active">资料</button><button role="tab" data-tab="analysis">用户分析</button><button role="tab" data-tab="dynamics">客户动态</button><button role="tab" data-tab="orders">订单记录</button><button role="tab" data-tab="learning">学习情况</button></div><div class="profile-body" id="profile-body"></div></div><div class="history-pane" id="history-content" hidden></div></aside>
</div></main><div class="toast" role="status" hidden></div><dialog id="modal"><div class="modal-head"><strong id="modal-title"></strong><button data-action="close-modal" aria-label="关闭">×</button></div><div id="modal-body"></div><div class="modal-footer"><button class="plain-button" data-action="close-modal">取消</button><button class="send-button" id="modal-confirm">确定</button></div></dialog><script src="./dynamics.js"></script><script src="./app.js"></script>
</body></html>
